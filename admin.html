<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sᴍᴏᴋᴇ•X Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#05070d;
color:#fff;
min-height:100vh
}

header{
height:65px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
background:#0b1020;
border-bottom:1px solid #00e5ff33;
position:sticky;
top:0;
z-index:10
}

.logo{
font-size:20px;
font-weight:1000;
color:#00e5ff
}

.logout{
border:0;
background:#30101a;
color:#ff718d;
padding:10px 15px;
border-radius:9px;
font-weight:bold;
cursor:pointer
}

.layout{
display:flex;
min-height:calc(100vh - 65px)
}

.sidebar{
width:220px;
background:#080c16;
border-right:1px solid #ffffff12;
padding:15px
}

.nav{
width:100%;
padding:13px;
margin-bottom:8px;
border:0;
border-radius:9px;
background:transparent;
color:#8fa3bd;
text-align:left;
font-weight:bold;
cursor:pointer
}

.nav:hover,.nav.active{
background:#122139;
color:#fff
}

main{
flex:1;
padding:25px;
max-width:1400px
}

.page{
display:none
}

.page.active{
display:block
}

h1{
margin:0 0 8px;
font-size:28px
}

.sub{
color:#8fa3bd;
margin-bottom:25px
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
margin-bottom:20px
}

.stat{
background:#0b1020;
border:1px solid #ffffff12;
border-radius:15px;
padding:20px
}

.stat small{
color:#8fa3bd;
font-weight:bold
}

.stat strong{
display:block;
font-size:32px;
color:#00e5ff;
margin-top:8px
}

.card{
background:#0b1020;
border:1px solid #ffffff12;
border-radius:15px;
padding:20px;
margin-bottom:20px
}

button{
font-family:inherit
}

.primary{
background:linear-gradient(90deg,#00b8d9,#6d3df5);
color:#fff;
border:0;
border-radius:9px;
padding:11px 15px;
font-weight:bold;
cursor:pointer
}

.danger{
background:#dc173c;
color:#fff;
border:0;
border-radius:8px;
padding:8px 11px;
font-weight:bold;
cursor:pointer
}

.secondary{
background:#182235;
color:#fff;
border:0;
border-radius:8px;
padding:8px 11px;
font-weight:bold;
cursor:pointer
}

.toolbar{
display:flex;
gap:10px;
margin-bottom:15px
}

input,textarea,select{
width:100%;
background:#070c16;
border:1px solid #33445e;
border-radius:9px;
padding:12px;
color:#fff;
outline:none
}

textarea{
min-height:100px;
resize:vertical
}

label{
display:block;
font-size:12px;
font-weight:bold;
color:#b9c8da;
margin:12px 0 6px
}

.question{
background:#080e1a;
border:1px solid #ffffff12;
border-radius:12px;
padding:16px;
margin-bottom:10px
}

.question-title{
font-weight:bold;
line-height:1.5;
margin-bottom:10px
}

.tags{
display:flex;
gap:6px;
flex-wrap:wrap;
margin-bottom:12px
}

.tag{
background:#142035;
color:#9fb0c7;
padding:5px 8px;
border-radius:6px;
font-size:11px
}

.actions{
display:flex;
gap:7px
}

.student{
display:flex;
justify-content:space-between;
align-items:center;
padding:14px;
margin-bottom:8px;
background:#080e1a;
border:1px solid #ffffff12;
border-radius:10px
}

.student-name{
font-weight:bold
}

.student-info{
color:#8fa3bd;
font-size:12px;
margin-top:4px
}

.role{
padding:6px 9px;
border-radius:7px;
font-size:11px;
font-weight:bold
}

.admin{
background:#32166a;
color:#d8b4fe
}

.student-role{
background:#103023;
color:#67f59f
}

.modal{
display:none;
position:fixed;
inset:0;
background:#000c;
z-index:50;
padding:20px;
overflow:auto
}

.modal.show{
display:flex;
justify-content:center;
align-items:flex-start
}

.modal-box{
width:min(700px,100%);
background:#0b1020;
border:1px solid #00e5ff44;
border-radius:16px;
padding:22px;
margin-top:30px
}

.modal-head{
display:flex;
justify-content:space-between;
align-items:center
}

.close{
border:0;
background:#182235;
color:#fff;
border-radius:7px;
padding:8px 11px;
cursor:pointer
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.full{
grid-column:1/-1
}

.form-buttons{
display:flex;
justify-content:flex-end;
gap:8px;
margin-top:15px
}

.message{
position:fixed;
bottom:20px;
right:20px;
background:#10182b;
border:1px solid #00e5ff55;
padding:13px 17px;
border-radius:9px;
display:none;
z-index:100;
font-weight:bold
}

.message.show{
display:block
}

.message.error{
border-color:#ff3b5c;
color:#ff718d
}

@media(max-width:750px){

.layout{
display:block
}

.sidebar{
width:100%;
display:flex;
overflow-x:auto;
gap:5px
}

.nav{
white-space:nowrap;
width:auto
}

main{
padding:15px
}

.stats{
grid-template-columns:1fr
}

.grid{
grid-template-columns:1fr
}

.full{
grid-column:auto
}

.toolbar{
flex-wrap:wrap
}

.student{
align-items:flex-start;
gap:10px;
flex-direction:column
}

}
</style>
</head>

<body>

<header>
<div class="logo">⚡ Sᴍᴏᴋᴇ•X ADMIN 👑</div>
<button class="logout" onclick="logout()">LOGOUT</button>
</header>

<div class="layout">

<aside class="sidebar">

<button class="nav active" onclick="page('dashboard',this)">
📊 Dashboard
</button>

<button class="nav" onclick="page('questions',this)">
📝 Questions
</button>

<button class="nav" onclick="page('students',this)">
👥 Students
</button>

</aside>

<main>

<!-- DASHBOARD -->

<section id="dashboard" class="page active">

<h1>Admin Dashboard</h1>

<div class="sub">
Welcome to the Sᴍᴏᴋᴇ•X CBT control panel.
</div>

<div class="stats">

<div class="stat">
<small>STUDENTS</small>
<strong id="studentCount">0</strong>
</div>

<div class="stat">
<small>QUESTIONS</small>
<strong id="questionCount">0</strong>
</div>

<div class="stat">
<small>ADMINS</small>
<strong id="adminCount">0</strong>
</div>

</div>

<div class="card">

<h3>Quick Actions</h3>

<button class="primary" onclick="openAdd()">
➕ Add Question
</button>

</div>

</section>


<!-- QUESTIONS -->

<section id="questions" class="page">

<h1>Question Manager</h1>

<div class="sub">
Create and manage CBT questions.
</div>

<div class="toolbar">

<input
id="search"
placeholder="Search questions..."
oninput="renderQuestions()">

<button class="primary" onclick="openAdd()">
➕ Add Question
</button>

</div>

<div id="questionList"></div>

</section>


<!-- STUDENTS -->

<section id="students" class="page">

<h1>Students</h1>

<div class="sub">
View registered users and account roles.
</div>

<div class="toolbar">

<input
id="studentSearch"
placeholder="Search students..."
oninput="renderStudents()">

</div>

<div id="studentList"></div>

</section>

</main>
</div>


<!-- QUESTION MODAL -->

<div class="modal" id="modal">

<div class="modal-box">

<div class="modal-head">

<h2 id="modalTitle">Add Question</h2>

<button class="close" onclick="closeModal()">✕</button>

</div>

<input type="hidden" id="editId">

<div class="grid">

<div>
<label>SUBJECT</label>
<input id="subject" placeholder="Physics">
</div>

<div>
<label>TOPIC</label>
<input id="topic" placeholder="Electricity">
</div>

<div class="full">
<label>QUESTION</label>
<textarea id="question" placeholder="Enter question"></textarea>
</div>

<div>
<label>OPTION A</label>
<input id="a">
</div>

<div>
<label>OPTION B</label>
<input id="b">
</div>

<div>
<label>OPTION C</label>
<input id="c">
</div>

<div>
<label>OPTION D</label>
<input id="d">
</div>

<div>
<label>CORRECT ANSWER</label>
<select id="answer">
<option value="">Select answer</option>
<option value="A">A</option>
<option value="B">B</option>
<option value="C">C</option>
<option value="D">D</option>
</select>
</div>

<div>
<label>DIFFICULTY</label>
<select id="difficulty">
<option value="easy">Easy</option>
<option value="medium" selected>Medium</option>
<option value="hard">Hard</option>
</select>
</div>

<div class="full">
<label>EXPLANATION</label>
<textarea id="explanation" placeholder="Explain the correct answer"></textarea>
</div>

</div>

<div class="form-buttons">

<button class="secondary" onclick="closeModal()">
Cancel
</button>

<button class="primary" id="saveBtn" onclick="saveQuestion()">
Save Question
</button>

</div>

</div>
</div>


<div class="message" id="message"></div>


<script>

const supabaseClient = supabase.createClient(
'https://drpmzohaaoygnpyepzde.supabase.co',
'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJkcnBtem9oYWFveWducHllcHpkZSIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzg2MzEzNjE3LCJleHAiOjIxMDE4ODk2MTl9.MrGNejr7eyrk2l1CCn9xkehLB6_aGltYm9UOrf0XPbE'
);

let questions=[];
let students=[];


/* CHECK ADMIN */

async function start(){

const {
data:{session}
}=await supabaseClient.auth.getSession();

if(!session){
location.href='index.html';
return;
}

const {data:isAdmin,error}=await supabaseClient.rpc('is_admin');

if(error || isAdmin !== true){

alert('Access denied. Admin account required.');

await supabaseClient.auth.signOut();

location.href='index.html';

return;
}

loadQuestions();
loadStudents();

}


/* NAVIGATION */

function page(id,button){

document.querySelectorAll('.page').forEach(x=>{
x.classList.remove('active')
});

document.getElementById(id).classList.add('active');

document.querySelectorAll('.nav').forEach(x=>{
x.classList.remove('active')
});

button.classList.add('active');

}


/* QUESTIONS */

async function loadQuestions(){

const {data,error}=await supabaseClient
.from('questions')
.select('*')
.order('created_at',{ascending:false});

if(error){
show(error.message,true);
return;
}

questions=data||[];

document.getElementById('questionCount').textContent=questions.length;

renderQuestions();

}


function renderQuestions(){

const box=document.getElementById('questionList');

const search=
(document.getElementById('search').value||'')
.toLowerCase();

const list=questions.filter(q=>{

return [
q.subject,
q.topic,
q.question,
q.option_a,
q.option_b,
q.option_c,
q.option_d
]
.join(' ')
.toLowerCase()
.includes(search);

});


if(!list.length){

box.innerHTML=`
<div class="card">
No questions found.
</div>
`;

return;
}


box.innerHTML=list.map((q,i)=>`

<div class="question">

<div class="question-title">
${i+1}. ${esc(q.question)}
</div>

<div class="tags">

<span class="tag">${esc(q.subject||'No subject')}</span>

<span class="tag">${esc(q.topic||'No topic')}</span>

<span class="tag">
Difficulty: ${esc(q.difficulty||'medium')}
</span>

<span class="tag">
Answer: ${esc(q.correct_answer||'')}
</span>

</div>

<div class="actions">

<button class="secondary"
onclick="editQuestion('${q.id}')">
✏️ Edit
</button>

<button class="danger"
onclick="deleteQuestion('${q.id}')">
🗑️ Delete
</button>

</div>

</div>

`).join('');

}


/* OPEN ADD */

function openAdd(){

clearForm();

document.getElementById('modalTitle').textContent=
'Add Question';

document.getElementById('saveBtn').textContent=
'Save Question';

document.getElementById('modal').classList.add('show');

}


/* EDIT */

function editQuestion(id){

const q=questions.find(x=>x.id===id);

if(!q)return;

document.getElementById('editId').value=q.id;

document.getElementById('subject').value=q.subject||'';

document.getElementById('topic').value=q.topic||'';

document.getElementById('question').value=q.question||'';

document.getElementById('a').value=q.option_a||'';

document.getElementById('b').value=q.option_b||'';

document.getElementById('c').value=q.option_c||'';

document.getElementById('d').value=q.option_d||'';

document.getElementById('answer').value=q.correct_answer||'';

document.getElementById('difficulty').value=
q.difficulty||'medium';

document.getElementById('explanation').value=
q.explanation||'';

document.getElementById('modalTitle').textContent=
'Edit Question';

document.getElementById('saveBtn').textContent=
'Update Question';

document.getElementById('modal').classList.add('show');

}


/* SAVE */

async function saveQuestion(){

const id=document.getElementById('editId').value;

const payload={

subject:document.getElementById('subject').value.trim(),

topic:document.getElementById('topic').value.trim(),

question:document.getElementById('question').value.trim(),

option_a:document.getElementById('a').value.trim(),

option_b:document.getElementById('b').value.trim(),

option_c:document.getElementById('c').value.trim(),

option_d:document.getElementById('d').value.trim(),

correct_answer:document.getElementById('answer').value,

difficulty:document.getElementById('difficulty').value,

explanation:document.getElementById('explanation').value.trim()

};


if(
!payload.subject ||
!payload.question ||
!payload.option_a ||
!payload.option_b ||
!payload.option_c ||
!payload.option_d ||
!payload.correct_answer
){

show('Fill all required question fields.',true);
return;

}


const button=document.getElementById('saveBtn');

button.disabled=true;

let error;


if(id){

const result=await supabaseClient
.from('questions')
.update(payload)
.eq('id',id);

error=result.error;

}else{

const result=await supabaseClient
.from('questions')
.insert(payload);

error=result.error;

}


button.disabled=false;


if(error){

show(error.message,true);
return;

}


closeModal();

show(
id
?'Question updated successfully!'
:'Question added successfully!'
);

loadQuestions();

}


/* DELETE */

async function deleteQuestion(id){

if(!confirm(
'Are you sure you want to delete this question?'
))return;


const {error}=await supabaseClient
.from('questions')
.delete()
.eq('id',id);


if(error){

show(error.message,true);
return;

}


show('Question deleted.');

loadQuestions();

}


/* STUDENTS */

async function loadStudents(){

const {data,error}=await supabaseClient
.from('profiles')
.select(
'id,username,display_name,role,xp,level,created_at'
)
.order('created_at',{ascending:false});


if(error){

show(error.message,true);
return;

}


students=data||[];

const normal=students.filter(
x=>x.role!=='admin'
).length;

const admins=students.filter(
x=>x.role==='admin'
).length;

document.getElementById('studentCount').textContent=normal;

document.getElementById('adminCount').textContent=admins;

renderStudents();

}


function renderStudents(){

const box=document.getElementById('studentList');

const search=
(document.getElementById('studentSearch').value||'')
.toLowerCase();


const list=students.filter(x=>{

return [
x.username,
x.display_name,
x.role
]
.join(' ')
.toLowerCase()
.includes(search);

});


if(!list.length){

box.innerHTML=
'<div class="card">No users found.</div>';

return;

}


box.innerHTML=list.map(x=>`

<div class="student">

<div>

<div class="student-name">
${esc(x.display_name||x.username||'User')}
</div>

<div class="student-info">
@${esc(x.username||'unknown')}
&nbsp; • &nbsp;
XP: ${x.xp||0}
&nbsp; • &nbsp;
Level: ${x.level||1}
</div>

</div>

<div class="role ${
x.role==='admin'
?'admin'
:'student-role'
}">
${
x.role==='admin'
?'👑 ADMIN'
:'🎓 STUDENT'
}
</div>

</div>

`).join('');

}


/* CLEAR FORM */

function clearForm(){

document.getElementById('editId').value='';

document.getElementById('subject').value='';

document.getElementById('topic').value='';

document.getElementById('question').value='';

document.getElementById('a').value='';

document.getElementById('b').value='';

document.getElementById('c').value='';

document.getElementById('d').value='';

document.getElementById('answer').value='';

document.getElementById('difficulty').value='medium';

document.getElementById('explanation').value='';

}


/* CLOSE */

function closeModal(){

document.getElementById('modal')
.classList.remove('show');

}


/* LOGOUT */

async function logout(){

await supabaseClient.auth.signOut();

location.href='index.html';

}


/* MESSAGE */

let timer;

function show(text,error=false){

const box=document.getElementById('message');

box.textContent=text;

box.className=
'message show'+
(error?' error':'');

clearTimeout(timer);

timer=setTimeout(()=>{
box.classList.remove('show');
},3500);

}


/* ESCAPE HTML */

function esc(value){

return String(value??'')
.replace(/&/g,'&amp;')
.replace(/</g,'&lt;')
.replace(/>/g,'&gt;')
.replace(/"/g,'&quot;')
.replace(/'/g,'&#039;');

}


/* START */

start();

</script>

</body>
  </html>
